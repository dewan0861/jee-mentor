<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for mobile icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glow inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Central Academic Emblem -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- Graduation Cap / Scholar Diamond -->
    <path d="M 0 -85 L 145 -15 L 0 55 L -145 -15 Z" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.25))"/>
    
    <!-- Cap Under-arc -->
    <path d="M -90 10 Q 0 85 90 10 L 90 60 Q 0 135 -90 60 Z" fill="#e0e7ff"/>
    
    <!-- Gold Tassel -->
    <path d="M 145 -15 C 160 15, 175 60, 160 95 C 150 115, 135 125, 145 145" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="155" r="14" fill="url(#gold)"/>

    <!-- Atom Orbit Electron Path -->
    <ellipse cx="0" cy="15" rx="160" ry="50" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-dasharray="12 12" transform="rotate(-25)" opacity="0.8"/>
  </g>

  <!-- Typography at bottom: JEE 2027 -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    JEE 2027
  </text>
</svg>
